## Definimod el tipo de base de datos
quarkus.datasource.db-kind=postgresql
## Usuario con el que se conecta a la base de datos
quarkus.datasource.username=postgres
## Contraseña del usuario con el que se conecta a la base de datos
quarkus.datasource.password=2901
## URL de conexión a la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/trabajo_final
## Sincroización de la base de datos con el codigo
quarkus.hibernate-orm.database.generation=update
## Mostrar las consultas SQL en la consola
quarkus.hibernate-orm.log.sql=true

%dev.quarkus.datasource.dev-ui.allow-sql=true

//puerto de la base de datos
quarkus.http.port=8083
